services:

  grinning-cat-core:
    build:
      context: .
    container_name: grinning_cat_core
    # Uncomment the two lines below to use your .env (see .env.example)
    # env_file:
    #   - .env
    ports:
      - "1865:80"
      - "5678:5678" # only for development purposes (take away in production)
    extra_hosts:
      - "host.docker.internal:host-gateway" # This adds an entry to /etc/hosts file in the container mapping host.docker.internal to the host machine IP addr, allowing the container to access services running on the host, not only on Win and Mac but also Linux. See https://docs.docker.com/desktop/networking/#i-want-to-connect-from-a-container-to-a-service-on-the-host and https://docs.docker.com/reference/cli/docker/container/run/#add-host
    environment:
      - CAT_API_KEY=test
      # REQUIRED: the app does not start without it (>= 32 random chars). Set it in your shell or in .env
      - CAT_JWT_SECRET=${CAT_JWT_SECRET:?CAT_JWT_SECRET must be set (>= 32 random characters)}
      - CAT_REDIS_HOST=grinning_cat_redis
      - CAT_REDIS_PORT=6379
      - CAT_LOG_LEVEL=DEBUG
    volumes:
      - ./cat:/app/cat
      - ./data:/app/data
      - ./tests:/app/tests
      - ./migrations:/app/migrations
    restart: unless-stopped
    depends_on:
      grinning-cat-redis:
        condition: service_healthy
      grinning-cat-healthcheck:
        condition: service_healthy

  grinning-cat-redis:
    image: redis/redis-stack-server:latest
    container_name: grinning_cat_redis
    command: >
      sh -c 'redis-stack-server --protected-mode no --save 60 1 --dir /data --appendonly yes --appendfsync everysec'
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  grinning-cat-vector-memory:
    image: qdrant/qdrant:latest
    container_name: grinning_cat_vector_memory
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  grinning-cat-healthcheck:
    image: curlimages/curl:latest
    container_name: grinning_cat_healthcheck
    entrypoint: [ "/bin/sh", "-c", "--", "while true; do sleep 30; done;" ]
    depends_on:
      - grinning-cat-vector-memory
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://grinning-cat-vector-memory:6333/readyz" ]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: always

volumes:
  qdrant-data:
  redis-data: